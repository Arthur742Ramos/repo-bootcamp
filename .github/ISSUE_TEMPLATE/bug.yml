name: Bug report
description: Report a reproducible bug or regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please provide enough detail to reproduce the issue.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug
      placeholder: What is broken?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps, including command(s) and inputs
      placeholder: |
        1. Run ...
        2. Use ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Paste relevant logs, stack traces, or screenshots
      render: shell

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. v20.18.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04 / macOS 15 / Windows 11
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I can reproduce this on the latest version
          required: true
