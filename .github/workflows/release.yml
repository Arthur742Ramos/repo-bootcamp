name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: CI gates (lint, typecheck, test, e2e)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      # Fail fast if the pushed tag does not match package.json "version", so a
      # tag like v1.1.0 can never publish while package.json still says 1.0.0.
      # Runs before install so a mismatch fails cheaply.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Pushed tag '${GITHUB_REF_NAME}' does not match package.json version 'v$PKG_VERSION'"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version v$PKG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Verify packaging invariants
        run: npm run verify:packaging

      - name: Check formatting
        run: npm run format:check

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Audit all dependencies
        run: npm run security:audit:all

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Publish GitHub release archive
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build release archive
        run: |
          npm run build
          mkdir release-assets
          npm pack --pack-destination release-assets
          cd release-assets
          sha256sum *.tgz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
