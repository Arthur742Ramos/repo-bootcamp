name: Onboarding quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  scan:
    name: Score onboarding readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Repo Bootcamp
        id: build
        run: npm run build

      # This uses only deterministic analyzers; no Copilot token or model call
      # is required. The gate fails when any headline score falls below 70.
      - name: Run onboarding scan
        run: |
          set -o pipefail
          node dist/cli.js scan . --json --check --min-score 70 | tee "$RUNNER_TEMP/onboarding-scan.json"

      - name: Summarize pull request impact
        if: always() && !cancelled() && github.event_name == 'pull_request' && steps.build.outcome == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/onboarding-base" "$BASE_SHA"
          trap 'git worktree remove --force "$RUNNER_TEMP/onboarding-base"' EXIT
          node dist/cli.js scan "$RUNNER_TEMP/onboarding-base" --json > "$RUNNER_TEMP/onboarding-base.json"
          node dist/cli.js scan . --json > "$RUNNER_TEMP/onboarding-head.json"
          node scripts/onboarding-impact.mjs "$RUNNER_TEMP/onboarding-base.json" "$RUNNER_TEMP/onboarding-head.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload onboarding report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onboarding-scan-${{ github.run_id }}
          path: ${{ runner.temp }}/onboarding-scan.json
          if-no-files-found: ignore
          retention-days: 14
